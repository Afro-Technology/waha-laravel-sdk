name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer
          key: composer-${{ runner.os }}-php84-tools-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php84-tools-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Pint
        run: composer pint:test

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer
          key: composer-${{ runner.os }}-php84-tools-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php84-tools-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPStan
        run: composer stan

  phpunit:
    name: PHPUnit (Laravel ${{ matrix.laravel }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: "10"
            php: "8.1"
            illuminate: "^10.48"
            testbench: "^8.0"
            larastan: "^2.11"
            phpstan: "^1.12"
          - laravel: "11"
            php: "8.2"
            illuminate: "^11.44"
            testbench: "^9.0"
            larastan: "^3.9"
            phpstan: "^2.1"
          - laravel: "12"
            php: "8.3"
            illuminate: "^12.4"
            testbench: "^10.0"
            larastan: "^3.9"
            phpstan: "^2.1"
          - laravel: "13"
            php: "8.3"
            illuminate: "^13.0"
            testbench: "^11.0"
            larastan: "^3.9"
            phpstan: "^2.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies --with "illuminate/support:${{ matrix.illuminate }}" --with "orchestra/testbench:${{ matrix.testbench }}" --with "larastan/larastan:${{ matrix.larastan }}" --with "phpstan/phpstan:${{ matrix.phpstan }}"

      - name: PHPUnit
        run: composer test
