name: OpenAPI Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openapi-sync-pr
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Start WAHA (latest)
        run: |
          docker run -d --name waha -p 3000:3000 \
            -e "WHATSAPP_SWAGGER_USERNAME=${{ secrets.WAHA_SWAGGER_USERNAME }}" \
            -e "WHATSAPP_SWAGGER_PASSWORD=${{ secrets.WAHA_SWAGGER_PASSWORD }}" \
            devlikeapro/waha:latest

      - name: Wait for WAHA (-json reachable)
        env:
          SWAGGER_USER: ${{ secrets.WAHA_SWAGGER_USERNAME }}
          SWAGGER_PASS: ${{ secrets.WAHA_SWAGGER_PASSWORD }}
        run: |
          set -e

          CURL_AUTH_ARGS=""
          if [ -n "$SWAGGER_USER" ] && [ -n "$SWAGGER_PASS" ]; then
            CURL_AUTH_ARGS="-u ${SWAGGER_USER}:${SWAGGER_PASS}"
          fi

          for i in {1..90}; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" $CURL_AUTH_ARGS "http://localhost:3000/-json" || true)

            if [ "$code" = "200" ]; then
              echo "WAHA is ready (/-json -> 200)"
              exit 0
            fi

            echo "Waiting for WAHA... attempt=$i http_code=$code"
            sleep 2
          done

          echo "WAHA did not become ready in time"
          docker logs waha --tail 200
          exit 1

      - name: Run OpenAPI sync (fetch + generate + ide-helper if changed)
        env:
          WAHA_OPENAPI_URL: "http://localhost:3000/-json"
          WAHA_SWAGGER_USERNAME: ${{ secrets.WAHA_SWAGGER_USERNAME }}
          WAHA_SWAGGER_PASSWORD: ${{ secrets.WAHA_SWAGGER_PASSWORD }}
          WAHA_SPEC_PATH: "resources/openapi/openapi.json"
          WAHA_GENERATED_PATH: "src"
          WAHA_OPENAPI_GENERATOR_DRIVER: "docker"
          WAHA_OPENAPI_GENERATOR_IMAGE: "openapitools/openapi-generator-cli:v7.6.0"
          WAHA_OPENAPI_TIMEOUT: "30"
          WAHA_OPENAPI_GENERATOR_TIMEOUT: "300"
        run: php bin/openapi-sync.php

      - name: Run Pint (fix) - only if changes exist
        run: |
          set -e
          if ! git diff --quiet; then
            vendor/bin/pint
          else
            echo "No changes detected; skipping Pint."
          fi

      - name: Stop WAHA
        if: always()
        run: docker rm -f waha || true

      - name: Validate changed paths
        id: diff
        run: |
          set -e

          changed_files="$(git status --porcelain=v1 --untracked-files=all | sed -E 's/^...//')"

          if [ -z "$changed_files" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
            exit 0
          fi

          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Changed files:"
          printf '%s\n' "$changed_files"

          unexpected=0
          while IFS= read -r path; do
            case "$path" in
              resources/openapi/openapi.json|\
              src/Generated/*|\
              src/OpenApi/Tags/*|\
              src/OpenApi/WahaApiProxy.php|\
              src/OpenApi/WahaManagerProxy.php|\
              src/Facades/Waha.php)
                ;;
              *)
                echo "::error file=${path}::OpenAPI sync modified an unexpected file. Review this change manually."
                unexpected=1
                ;;
            esac
          done <<< "$changed_files"

          if [ "$unexpected" -ne 0 ]; then
            exit 1
          fi

      - name: Run validation
        if: steps.diff.outputs.changed == 'true'
        run: composer ci:all

      - name: Create OpenAPI sync pull request
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.OPENAPI_SYNC_TOKEN || github.token }}
          commit-message: "chore(openapi): sync spec + regenerate client"
          branch: "bot/openapi-sync"
          delete-branch: true
          title: "chore(openapi): sync spec + regenerate client"
          body: |
            Automated update:
            - fetched OpenAPI spec from running WAHA instance (/ -json)
            - regenerated client
            - regenerated IDE helper
            - applied Pint fixes (if any)
            - passed composer ci:all before opening this PR
          labels: |
            openapi
            automation
          base: main
          add-paths: |
            resources/openapi/openapi.json
            src/Generated
            src/OpenApi/Tags
            src/OpenApi/WahaApiProxy.php
            src/OpenApi/WahaManagerProxy.php
            src/Facades/Waha.php
